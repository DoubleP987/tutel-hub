name: Publish Tutel promotional website
on:
  push:
    branches: [main]
    paths: ['promo-site/**', '.github/workflows/promo-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: tutel-promo-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: promo-site
      - uses: actions/deploy-pages@v4
        id: deployment
