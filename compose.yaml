services:
  tutel-hub:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=384
      YT_DLP_PATH: /usr/local/bin/yt-dlp
      FFMPEG_PATH: /usr/bin/ffmpeg
      MUSIC_SEARCH_PREFIX: scsearch1
      DATABASE_PATH: /data/tutel.sqlite
      DATA_DIR: /data
      CONTROL_HOST: 0.0.0.0
      CONTROL_PORT: 3000
      PUBLIC_SITE_DIR: /public-site
    volumes:
      - ./data:/data:rw
      - ./netlify-public:/public-site:rw
    ports:
      - 127.0.0.1:3000:3000
    mem_limit: 700m
    cpus: 0.75
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
